<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Win11 Customizer</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <span class="cloud cloud-a"></span><span class="cloud cloud-b"></span><span class="cloud cloud-c"></span>
    <span class="grain"></span>
  </div>

  <div class="desktop">
    <header class="topbar">
      <div class="clock-block"><b id="clock">23:12</b><span id="date">вторник, 6 октября</span></div>
      <div class="system-state"><span class="signal"><i></i><i></i><i></i></span><span class="status-dot"></span><span id="adminState">Проверка…</span></div>
    </header>

    <main>
      <section class="welcome">
        <div class="monogram">W</div>
        <h1>Win11 Customizer</h1>
        <p>WINDOWS · PERSONALIZATION</p>
        <div class="welcome-stats"><span><b id="score">0</b> настроек активно</span><i></i><span id="version">версия —</span></div>
        <div class="welcome-actions">
          <button class="primary" id="recommendedBtn">Применить рекомендуемые</button>
          <button class="glass-button" id="restorePointBtn">Точка восстановления</button>
        </div>
      </section>

      <section class="workspace" id="workspace">
        <div class="workspace-head">
          <div><p class="eyebrow" id="eyebrow">ОБЗОР</p><h2 id="pageTitle">Моя Windows</h2></div>
          <div class="search"><span>⌕</span><input id="search" placeholder="Найти настройку…" autocomplete="off"></div>
        </div>
        <div class="filters"><button class="chip active" data-filter="all">Все</button><button class="chip" data-filter="recommended">Рекомендуемые</button><button class="chip" data-filter="enabled">Активные</button></div>
        <div class="section-head"><div><h3 id="sectionTitle">Все настройки</h3><p id="sectionDesc">Безопасные изменения Windows 11</p></div><span id="count"></span></div>
        <div class="grid" id="grid"><div class="loading">Читаю параметры Windows…</div></div>
      </section>
    </main>

    <aside class="dock-wrap" aria-label="Разделы программы">
      <nav id="nav"></nav><span class="dock-separator"></span>
      <button class="dock-action" id="restartBtn" title="Перезапустить Проводник">↻</button>
      <button class="dock-action danger-icon" id="restoreBtn" title="Откатить изменения">↶</button>
    </aside>

    <div class="backup-pill"><span class="backup-led"></span><div><b id="backupText">Резервная копия пуста</b><small>Исходные значения сохраняются автоматически</small></div><button id="exportBtn">Экспорт</button></div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="modal-wrap" id="modalWrap" hidden>
    <div class="modal"><span class="modal-icon" id="modalIcon">!</span><h3 id="modalTitle"></h3><p id="modalText"></p><div class="modal-actions"><button class="glass-button" id="modalCancel">Отмена</button><button class="primary" id="modalConfirm">Продолжить</button></div></div>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
