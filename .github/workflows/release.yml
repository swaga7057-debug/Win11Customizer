name: Build Windows release
# Release build for version 1.5.0.

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "web/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache: false

      - name: Restore Windows resources
        shell: pwsh
        run: |
          $compressed = [Convert]::FromBase64String((Get-Content assets/rsrc_windows_amd64.syso.gz.b64 -Raw).Trim())
          $source = [IO.MemoryStream]::new($compressed)
          $gzip = [IO.Compression.GZipStream]::new($source, [IO.Compression.CompressionMode]::Decompress)
          $target = [IO.File]::Create("rsrc_windows_amd64.syso")
          try { $gzip.CopyTo($target) } finally { $target.Dispose(); $gzip.Dispose(); $source.Dispose() }

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -buildvcs=false -trimpath -ldflags="-s -w -H=windowsgui" -o Win11Customizer.exe .

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path Win11Customizer.exe,README.md -DestinationPath Win11Customizer-1.5.0-Windows-x64.zip -Force

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.5.0 --cleanup-tag --yes 2>$null
          gh release create v1.5.0 Win11Customizer-1.5.0-Windows-x64.zip --title "Win11 Customizer 1.5.0" --notes "Профили оформления с предпросмотром, установка тем Windows, проверка совместимости сборки, быстрый Win32-реестр и подробный журнал действий."
